<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasarku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#">Pasarku</a>
    <input class="search" type="search" placeholder="Cari barang yang lu mau">
  </header>

  <main>
    <section class="hero">
      <h1>Barang bagus dari toko-toko kecil</h1>
      <p>Tiap penjual punya etalasenya sendiri.</p>
    </section>

    <section class="products">
      <article class="card">
        <div class="card-img"></div>
        <h2>Tas Anyaman Rotan</h2>
        <p class="store">Toko Rotan Kita</p>
        <p class="price">Rp185.000</p>
      </article>
      <article class="card">
        <div class="card-img"></div>
        <h2>Kopi Gayo 250 gram</h2>
        <p class="store">Kopi Pagi</p>
        <p class="price">Rp72.000</p>
      </article>
      <article class="card">
        <div class="card-img"></div>
        <h2>Tote Bag Kanvas</h2>
        <p class="store">Kanvas Lokal</p>
        <p class="price">Rp89.000</p>
      </article>
      <article class="card">
        <div class="card-img"></div>
        <h2>Lilin Aromaterapi</h2>
        <p class="store">Nyala Studio</p>
        <p class="price">Rp65.000</p>
      </article>
    </section>
  </main>
</body>
</html>
